apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
      - name: accounts
        image: us.icr.io/$SN_ICR_NAMESPACE/accounts:1
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URI
          value: "sqlite:////tmp/accounts.db"
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
spec:
  selector:
    app: accounts
  ports:
  - port: 8080
    targetPort: 8080
